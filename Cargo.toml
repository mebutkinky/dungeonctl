[workspace]
members = [
    "dungeonctl-audio",
    "dungeonctl-cli",
    "dungeonctl-core",
    "dungeonctl-device",
    "dungeonctl-graph",
    "dungeonctl-pattern",
    "dungeonctl-utils",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "Control smart electronic toys created by DG-LAB"
repository = "https://github.com/mebutkinky/dungeonctl"
license = "MIT OR Apache-2.0"
keywords = ["dg-lab", "coyote", "estim", "e-stim", "bluetooth"]
categories = ["api-bindings", "hardware-support"]

[workspace.dependencies]
arrayvec = "0.7.8"
async-stream = "0.3.6"
binrw = "0.15.2"
btleplug = "0.13.5"
bytemuck = "1.25.2"
either = "1.19.0"
eyre = "0.6.14"
futures = "0.3.34"
futures-signals = "0.3.34"
ndarray = "0.17.2"
svg = "0.18.0"
tokio = "1.54.1"
tracing = "0.1.44"

[package]
name = "dungeonctl"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
full = ["audio-full", "device-full", "graph", "pattern", "stream"]

audio = ["dep:dungeonctl-audio"]
audio-full = ["audio", "dungeonctl-audio/full", "pipewire", "symphonia"]
coyote3 = ["device", "dungeonctl-device/coyote3"]
device = ["dep:dungeonctl-device"]
device-full = ["coyote3", "dungeonctl-device/full"]
graph = ["dep:dungeonctl-graph"]
pattern = ["dep:dungeonctl-pattern"]
pipewire = ["audio", "dungeonctl-audio/pipewire"]
stream = ["pattern", "dungeonctl-pattern/stream"]
symphonia = ["audio", "dungeonctl-audio/symphonia"]

[dependencies]
dungeonctl-audio = { version = "0.2.0", path = "dungeonctl-audio", optional = true }
dungeonctl-core = { version = "0.2.0", path = "dungeonctl-core" }
dungeonctl-device = { version = "0.2.0", path = "dungeonctl-device", optional = true }
dungeonctl-pattern = { version = "0.2.0", path = "dungeonctl-pattern", optional = true }
dungeonctl-utils = { version = "0.2.0", path = "dungeonctl-utils" }
dungeonctl-graph = { version = "0.2.0", path = "dungeonctl-graph", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev.build-override]
opt-level = 3

[profile.release-debug]
inherits = "release"
debug = true
