[package]
name = "dungeonctl-pattern"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
stream = ["dep:async-stream", "dep:arrayvec", "dep:futures"]

[dependencies]
arrayvec = { optional = true, workspace = true, default-features = true }
async-stream = { optional = true, workspace = true }
bytemuck = { features = ["derive"], workspace = true, default-features = true }
dungeonctl-core = { version = "0.1.0", path = "../dungeonctl-core" }
futures = { optional = true, workspace = true, default-features = true }
ndarray.workspace = true
ndarray-stats = "0.7.0"
noisy_float = "0.2.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
