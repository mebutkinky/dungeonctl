[package]
name = "dungeonctl-audio"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
full = ["pipewire", "symphonia"]
pipewire = ["dep:bytemuck", "dep:pw"]
symphonia = ["dep:symphonia"]

[dependencies]
async-channel = "2.5.0"
async-stream.workspace = true
blocking = "1.7.0"
bytemuck = { optional = true, workspace = true }
dungeonctl-pattern = { version = "0.2.0", path = "../dungeonctl-pattern", features = ["stream"] }
either.workspace = true
eyre.workspace = true
futures.workspace = true
futures-lite = "2.6.1"
ndarray.workspace = true
pw = { package = "pipewire", version = "0.10.1", optional = true }
pin-project-lite = "0.2.17"
realfft = "3.5.1"
symphonia = { version = "0.6.1", features = ["all-codecs"], optional = true }
tracing.workspace = true
thingbuf = "0.1.6"
ndarray-stats = "0.7.0"
noisy_float = "0.2.1"

[dev-dependencies]
humantime = "2.4.0"
plotters = "0.3.7"
svg.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
