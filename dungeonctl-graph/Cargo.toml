[package]
name = "dungeonctl-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
dungeonctl-pattern = { version = "0.1.0", path = "../dungeonctl-pattern" }
eyre.workspace = true
palette = "0.7.7"
svg.workspace = true

[dev-dependencies]
dungeonctl-audio = { path = "../dungeonctl-audio", features = ["symphonia"] }
tokio = { features = ["macros", "rt-multi-thread"], workspace = true, default-features = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
